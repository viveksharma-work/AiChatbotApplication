#Server
server.port=8080
spring.application.name=ai-chatbot-backend

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/DB_name
spring.datasource.username=#username
spring.datasource.password=#password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
app.session.ttl-minutes=30

#LLM API
app.openai.api-key=#key
app.openai.base-url=#url
app.openai.model=#model
app.openai.max-tokens=1024
app.openai.system-prompt=You are a helpful, context-aware assistant. Use the conversation history to provide relevant, coherent responses.

#Context Window Management
app.chat.max-context-messages=20

#Actuator(Health check PostgreSQL and Redis)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
